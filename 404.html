<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0c0c0c">
    <title>Page not found | Cobbleworks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .death-screen {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 16px;
        overflow: hidden;
        isolation: isolate;
        text-align: center;
      }
      .death-screen::before {
        content: "";
        position: absolute;
        inset: -20px;
        z-index: -2;
        background: url("/assets/cobbleworks-hero-september-2026.png") center / cover;
        filter: blur(3px) saturate(0.6);
      }
      .death-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(rgba(80, 0, 0, 0.62), rgba(160, 0, 0, 0.72));
      }
      .death-screen h1 {
        margin-bottom: 28px;
        font-family: var(--font-logo);
        font-size: clamp(30px, 7vw, 64px);
        font-weight: 400;
        line-height: 1.3;
        text-shadow: 4px 4px 0 #3f3f3f;
      }
      .death-screen .message {
        max-width: 520px;
        margin: 0 auto 12px;
        color: #e6e6e6;
        font-size: 20px;
        text-shadow: 2px 2px 0 #3f3f3f;
      }
      .death-screen .score {
        margin-bottom: 40px;
        font-size: 20px;
        text-shadow: 2px 2px 0 #3f3f3f;
      }
      .death-screen .score span {
        color: var(--mc-yellow);
        text-shadow: 2px 2px 0 #3f3f15;
      }
      .death-screen .actions {
        display: grid;
        gap: 10px;
        width: min(400px, 100%);
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main class="death-screen">
      <div>
        <h1>You Died!</h1>
        <p class="message">You fell into the wrong chunk. The page you requested does not exist.</p>
        <p class="score">Score: <span>404</span></p>
        <div class="actions">
          <a class="button button-primary" href="/#plugins">Respawn</a>
          <a class="button" href="/">Title Screen</a>
        </div>
      </div>
    </main>
  </body>
</html>
